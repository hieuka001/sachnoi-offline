name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "plugins/**"
      - "web-src/**"
      - "src/**"
      - "voices/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (chặn build nếu test vàng đỏ)
        run: npm test && npm run check:manifest

      - name: Build web (đóng kèm trong app — app chạy offline, không nạp web từ xa)
        run: npm run build:web

      # 3.3.0: TTS = sherpa-onnx (xcframework chính thức của k2-fsa, ghim bản
      # 1.13.8) + model Supertonic 3 int8 gắn sẵn. Engine VieNeu tự port +
      # sea-g2p Rust đã XOÁ nên không còn bước build Rust nữa.
      # Biến thể "shared-onnxruntime-static": dylib SherpaOnnxC TỰ CHỨA
      # onnxruntime (kiểm tại máy: 0 tham chiếu Ort chưa định nghĩa, chỉ
      # link framework hệ thống). Biến thể "-ios-static" KHÔNG tự chứa —
      # link lỗi "Undefined _OrtGetApiBase" (2.0.0 fix3, commit 57ee1bb).
      # Gói của biến thể này đã sẵn tên SherpaOnnxC.xcframework — khớp
      # framework bên trong, khỏi đổi tên (2.0.0 fix2, commit 7017eb0:
      # CocoaPods lấy tên gói làm cờ -framework nên gói sherpa-onnx
      # báo "framework 'sherpa-onnx' not found").
      - name: Fetch sherpa-onnx xcframework (k2-fsa release, pinned)
        run: |
          curl -fL --retry 3 -o /tmp/sherpa-ios.zip \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v1.13.8-ios-shared-onnxruntime-static.xcframework.zip"
          echo "e259a7d3b38ad7dec49bb078252a30bb42ede8355e2bb130cf8c1c78ed131f75  /tmp/sherpa-ios.zip" | shasum -a 256 -c -
          rm -rf /tmp/sherpa-ios && unzip -q /tmp/sherpa-ios.zip -d /tmp/sherpa-ios
          mkdir -p plugins/sachnoi-bridge/ios/Frameworks
          rm -rf plugins/sachnoi-bridge/ios/Frameworks/SherpaOnnxC.xcframework
          cp -R /tmp/sherpa-ios/SherpaOnnxC.xcframework plugins/sachnoi-bridge/ios/Frameworks/
          ls plugins/sachnoi-bridge/ios/Frameworks/SherpaOnnxC.xcframework

      # Model Supertonic 3 int8 GẮN SẴN (3.3.0, bản thử theo lệnh của anh):
      # gói gốc của k2-fsa (tts-models) tải nguyên tarball + kiểm SHA-256,
      # lấy đúng 7 file model vào SupertonicAssets.
      - name: Fetch bundled Supertonic 3 model (k2-fsa tts-models + SHA-256)
        run: |
          curl -fL --retry 3 -o /tmp/supertonic.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2"
          echo "82fa96f91c4ef8abaae3a14a3f4153facf88bed821d1f7331cec2700f432c427  /tmp/supertonic.tar.bz2" | shasum -a 256 -c -
          rm -rf /tmp/supertonic && mkdir -p /tmp/supertonic
          tar xf /tmp/supertonic.tar.bz2 -C /tmp/supertonic
          SRC=/tmp/supertonic/sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          mkdir -p ios/App/App/SupertonicAssets
          cp "$SRC/duration_predictor.int8.onnx" "$SRC/text_encoder.int8.onnx" \
             "$SRC/vector_estimator.int8.onnx" "$SRC/vocoder.int8.onnx" \
             "$SRC/tts.json" "$SRC/unicode_indexer.bin" "$SRC/voice.bin" \
             ios/App/App/SupertonicAssets/
          ls -la ios/App/App/SupertonicAssets
          du -sh ios/App/App/SupertonicAssets

      - name: Sync Capacitor iOS (incl. pod install)
        run: npx cap sync ios

      - name: Build unsigned .app (iphoneos)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package + verify IPA
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH" || { echo "App.app not found"; find "$GITHUB_WORKSPACE/build" -name "*.app" -maxdepth 6; exit 1; }
          file "$APP_PATH/App"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          echo "--- UIBackgroundModes (phải có audio + processing) ---"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :BGTaskSchedulerPermittedIdentifiers" "$APP_PATH/Info.plist"
          echo "--- Kiểm tra model gắn sẵn: PHẢI có SupertonicAssets đủ 7 file ---"
          test -f "$APP_PATH/SupertonicAssets/voice.bin" || { echo "LỖI: IPA thiếu SupertonicAssets — bản 3.3.0 phải gắn sẵn model Supertonic 3"; exit 1; }
          ls "$APP_PATH/SupertonicAssets" | wc -l
          du -sh "$APP_PATH/SupertonicAssets"
          echo "--- 3.3.0: IPA KHÔNG được còn TTSAssets/NanoAssets; binary phải có giọng hệ thống + Supertonic + kho render ---"
          test ! -e "$APP_PATH/TTSAssets" || { echo "LỖI: IPA vẫn còn TTSAssets — VieNeu đã bỏ từ 3.3.0"; exit 1; }
          test ! -e "$APP_PATH/NanoAssets" || { echo "LỖI: IPA vẫn còn NanoAssets — Nano đã bỏ từ 2.2.0"; exit 1; }
          strings "$APP_PATH/App" | grep -m1 "Supertonic 3" || { echo "LỖI: binary không có SupertonicEngine"; exit 1; }
          strings "$APP_PATH/App" | grep -m1 "TTSRender" || { echo "LỖI: binary không có RenderStore (render trước)"; exit 1; }
          strings "$APP_PATH/App" | grep -m1 "AVSpeechSynthesizer" || { echo "LỖI: binary không có AVSpeechSynthesizer (giọng hệ thống)"; exit 1; }
          echo "--- Kiểm tra framework SherpaOnnxC nhúng trong .app ---"
          # SherpaOnnxC là framework ĐỘNG nhúng trong .app (onnxruntime nằm
          # trong nó) — kiểm ở binary của framework, không phải binary App.
          FW_BIN=$(find "$APP_PATH" -name "SherpaOnnxC" -type f | head -1)
          [ -n "$FW_BIN" ] || { echo "LỖI: không thấy framework SherpaOnnxC trong .app"; exit 1; }
          strings "$FW_BIN" | grep -m1 "SherpaOnnxCreateOfflineTts" || { echo "LỖI: framework không có sherpa-onnx"; exit 1; }
          du -sh "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "SachNoi-unsigned.ipa" Payload
          ls -lh "SachNoi-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: SachNoi-unsigned-ipa
          path: SachNoi-unsigned.ipa
          retention-days: 30
