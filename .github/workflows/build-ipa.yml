name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "plugins/**"
      - "web-src/**"
      - "src/**"
      - "voices/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (chặn build nếu test vàng đỏ)
        run: npm test && npm run check:manifest

      - name: Build web (đóng kèm trong app — app chạy offline, không nạp web từ xa)
        run: npm run build:web

      # 2.0.0: TTS = sherpa-onnx (xcframework tĩnh chính thức của k2-fsa,
      # ghim bản 1.13.8) + model Piper tiếng Việt gắn sẵn. Engine VieNeu tự
      # port + sea-g2p Rust đã XOÁ nên không còn bước build Rust nữa.
      - name: Fetch sherpa-onnx xcframework (k2-fsa release, pinned)
        run: |
          curl -fL --retry 3 -o /tmp/sherpa-ios.zip \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v1.13.8-ios-static.xcframework.zip"
          echo "6b8e769cb153343270fdccbe92e3b3db0d1c421d67fa0989ab01fdf5b2fcf2de  /tmp/sherpa-ios.zip" | shasum -a 256 -c -
          rm -rf /tmp/sherpa-ios && unzip -q /tmp/sherpa-ios.zip -d /tmp/sherpa-ios
          mkdir -p plugins/sachnoi-bridge/ios/Frameworks
          rm -rf plugins/sachnoi-bridge/ios/Frameworks/sherpa-onnx.xcframework
          cp -R /tmp/sherpa-ios/sherpa-onnx.xcframework plugins/sachnoi-bridge/ios/Frameworks/
          ls plugins/sachnoi-bridge/ios/Frameworks/sherpa-onnx.xcframework

      # Model Piper vi_VN-vais1000-medium từ Release piper-vi-v1 của chính
      # repo này (nguồn gốc: huggingface csukuangfj/vits-piper-vi_VN-vais1000-medium).
      - name: Fetch bundled Piper voice (Release piper-vi-v1 + SHA-256)
        run: |
          mkdir -p ios/App/App/PiperAssets
          BASE="https://github.com/hieuka001/sachnoi-offline/releases/download/piper-vi-v1"
          curl -fL --retry 3 -o ios/App/App/PiperAssets/vi_VN-vais1000-medium.onnx "$BASE/vi_VN-vais1000-medium.onnx"
          curl -fL --retry 3 -o ios/App/App/PiperAssets/tokens.txt "$BASE/tokens.txt"
          curl -fL --retry 3 -o /tmp/espeak-ng-data.zip "$BASE/espeak-ng-data.zip"
          cd ios/App/App/PiperAssets && unzip -q /tmp/espeak-ng-data.zip && cd "$GITHUB_WORKSPACE"
          cat > /tmp/piper-sha.txt <<'EOF'
          7264e130a2f2e62c2dd586e3790ba054b669f9f72a2bdb2c0d60207136611576  ios/App/App/PiperAssets/vi_VN-vais1000-medium.onnx
          87c8ef66eae5473ed0cc0366b3964c736ca6c5f676c979522ea31234e47430b9  ios/App/App/PiperAssets/tokens.txt
          EOF
          shasum -a 256 -c /tmp/piper-sha.txt
          du -sh ios/App/App/PiperAssets

      - name: Sync Capacitor iOS (incl. pod install)
        run: npx cap sync ios

      - name: Build unsigned .app (iphoneos)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package + verify IPA
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH" || { echo "App.app not found"; find "$GITHUB_WORKSPACE/build" -name "*.app" -maxdepth 6; exit 1; }
          file "$APP_PATH/App"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          echo "--- UIBackgroundModes (phải có audio + processing) ---"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :BGTaskSchedulerPermittedIdentifiers" "$APP_PATH/Info.plist"
          echo "--- Kiểm tra model gắn sẵn: PHẢI có PiperAssets (2.0.0+) ---"
          test -f "$APP_PATH/PiperAssets/vi_VN-vais1000-medium.onnx" || { echo "LỖI: IPA thiếu model Piper gắn sẵn"; exit 1; }
          test -f "$APP_PATH/PiperAssets/tokens.txt" || { echo "LỖI: IPA thiếu tokens.txt"; exit 1; }
          test -d "$APP_PATH/PiperAssets/espeak-ng-data" || { echo "LỖI: IPA thiếu espeak-ng-data"; exit 1; }
          echo "--- Kiểm tra binary có sherpa-onnx ---"
          strings "$APP_PATH/App" | grep -m1 "SherpaOnnxCreateOfflineTts" || { echo "LỖI: binary không có sherpa-onnx"; exit 1; }
          du -sh "$APP_PATH/PiperAssets"
          du -sh "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "SachNoi-unsigned.ipa" Payload
          ls -lh "SachNoi-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: SachNoi-unsigned-ipa
          path: SachNoi-unsigned.ipa
          retention-days: 30
