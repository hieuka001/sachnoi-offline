name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "plugins/**"
      - "web-src/**"
      - "src/**"
      - "voices/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (chặn build nếu test vàng đỏ)
        run: npm test && npm run check:manifest

      - name: Build web (đóng kèm trong app — app chạy offline, không nạp web từ xa)
        run: npm run build:web

      # sea-g2p (bộ phiên âm tiếng Việt, Rust) -> thư viện tĩnh .a cho iOS qua C ABI,
      # ghim đúng commit bản 0.10.0 như pipeline Bút Nghiên đã kiểm chứng.
      - name: Build sea-g2p static library (Rust C ABI)
        run: |
          which cargo || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          git clone https://github.com/pnnbao97/sea-g2p.git /tmp/sea-g2p
          cd /tmp/sea-g2p
          git checkout e825173f235d08ea19315b2b279fb11153b44cea
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("Cargo.toml")
          t = p.read_text()
          assert 'crate-type = ["cdylib", "rlib"]' in t
          p.write_text(t.replace('crate-type = ["cdylib", "rlib"]',
                                 'crate-type = ["cdylib", "rlib", "staticlib"]'))
          PY
          cargo build --release --no-default-features --features capi --target aarch64-apple-ios
          mkdir -p "$GITHUB_WORKSPACE/plugins/sachnoi-bridge/ios/Plugin/vendor"
          cp target/aarch64-apple-ios/release/libsea_g2p_rs.a \
             "$GITHUB_WORKSPACE/plugins/sachnoi-bridge/ios/Plugin/vendor/"
          ls -lh "$GITHUB_WORKSPACE/plugins/sachnoi-bridge/ios/Plugin/vendor/"

      # LƯU Ý: bản này KHÔNG đóng model vào IPA (khác Bút Nghiên).
      # Core/giọng tải từ GitHub Releases khi người dùng bấm tải — IPA phải nhẹ.

      - name: Sync Capacitor iOS (incl. pod install)
        run: npx cap sync ios

      - name: Build unsigned .app (iphoneos)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package + verify IPA
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH" || { echo "App.app not found"; find "$GITHUB_WORKSPACE/build" -name "*.app" -maxdepth 6; exit 1; }
          file "$APP_PATH/App"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          echo "--- UIBackgroundModes (phải có audio + processing) ---"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :BGTaskSchedulerPermittedIdentifiers" "$APP_PATH/Info.plist"
          echo "--- Kiểm tra app NHẸ: không được chứa TTSAssets ---"
          if [ -d "$APP_PATH/TTSAssets" ]; then echo "LỖI: IPA chứa TTSAssets — app phải nhẹ, model tải từ Releases"; exit 1; fi
          du -sh "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "SachNoi-unsigned.ipa" Payload
          ls -lh "SachNoi-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: SachNoi-unsigned-ipa
          path: SachNoi-unsigned.ipa
          retention-days: 30
