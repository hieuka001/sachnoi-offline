name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "plugins/**"
      - "web-src/**"
      - "src/**"
      - "voices/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (chặn build nếu test vàng đỏ)
        run: npm test && npm run check:manifest

      - name: Build web (đóng kèm trong app — app chạy offline, không nạp web từ xa)
        run: npm run build:web

      # 2.1.0: THUẦN VieNeu — sea-g2p (bộ phiên âm tiếng Việt, Rust) dùng
      # cho engine Turbo -> thư viện tĩnh .a cho iOS qua
      # C ABI, ghim đúng commit bản 0.10.0 như pipeline đã kiểm chứng.
      - name: Build sea-g2p static library (Rust C ABI)
        run: |
          which cargo || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          git clone https://github.com/pnnbao97/sea-g2p.git /tmp/sea-g2p
          cd /tmp/sea-g2p
          git checkout e825173f235d08ea19315b2b279fb11153b44cea
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("Cargo.toml")
          t = p.read_text()
          assert 'crate-type = ["cdylib", "rlib"]' in t
          p.write_text(t.replace('crate-type = ["cdylib", "rlib"]',
                                 'crate-type = ["cdylib", "rlib", "staticlib"]'))
          PY
          cargo build --release --no-default-features --features capi --target aarch64-apple-ios
          mkdir -p "$GITHUB_WORKSPACE/plugins/sachnoi-bridge/ios/Plugin/vendor"
          cp target/aarch64-apple-ios/release/libsea_g2p_rs.a \
             "$GITHUB_WORKSPACE/plugins/sachnoi-bridge/ios/Plugin/vendor/"
          ls -lh "$GITHUB_WORKSPACE/plugins/sachnoi-bridge/ios/Plugin/vendor/"

      # Core VieNeu Turbo int8 GẮN SẴN (từ 1.0.5, theo yêu cầu người dùng):
      # assets từ Release core-vieneu-turbo-int8-v1 + kiểm SHA-256 theo
      # voices/voices.json.
      - name: Fetch bundled Turbo core (Release + SHA-256)
        run: |
          mkdir -p ios/App/App/TTSAssets
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("voices/voices.json").read_text())
          pack = next(p for p in m["packs"] if p["id"] == "vieneu-turbo-int8")
          lines = [f"{f['sha256']}  ios/App/App/TTSAssets/{f['name']}" for f in pack["files"]]
          pathlib.Path("/tmp/tts-sha.txt").write_text("\n".join(lines) + "\n")
          pathlib.Path("/tmp/tts-urls.txt").write_text("\n".join(f["url"] for f in pack["files"]) + "\n")
          print(f"{len(lines)} files")
          PY
          while read -r url; do curl -fL --retry 3 -o "ios/App/App/TTSAssets/$(basename "$url")" "$url"; done < /tmp/tts-urls.txt
          shasum -a 256 -c /tmp/tts-sha.txt
          du -sh ios/App/App/TTSAssets

      - name: Sync Capacitor iOS (incl. pod install)
        run: npx cap sync ios

      - name: Build unsigned .app (iphoneos)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package + verify IPA
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH" || { echo "App.app not found"; find "$GITHUB_WORKSPACE/build" -name "*.app" -maxdepth 6; exit 1; }
          file "$APP_PATH/App"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          echo "--- UIBackgroundModes (phải có audio + processing) ---"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :BGTaskSchedulerPermittedIdentifiers" "$APP_PATH/Info.plist"
          echo "--- Kiểm tra model gắn sẵn: PHẢI có TTSAssets đủ 12 file (Turbo) ---"
          test -f "$APP_PATH/TTSAssets/config.json" || { echo "LỖI: IPA thiếu TTSAssets — bản 2.1.0 phải gắn sẵn core Turbo"; exit 1; }
          ls "$APP_PATH/TTSAssets" | wc -l
          du -sh "$APP_PATH/TTSAssets"
          echo "--- 2.2.0: IPA KHÔNG được còn NanoAssets; binary phải có kho render trước ---"
          test ! -e "$APP_PATH/NanoAssets" || { echo "LỖI: IPA vẫn còn NanoAssets — bản 2.2.0 đã bỏ Nano"; exit 1; }
          strings "$APP_PATH/App" | grep -m1 "TTSRender" || { echo "LỖI: binary không có RenderStore (render trước)"; exit 1; }
          du -sh "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "SachNoi-unsigned.ipa" Payload
          ls -lh "SachNoi-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: SachNoi-unsigned-ipa
          path: SachNoi-unsigned.ipa
          retention-days: 30
