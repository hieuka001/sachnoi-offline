name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Golden tests (bộ test vàng tiếng Việt) + engine tests
        run: npm test
      - name: Kiểm tra manifest giọng
        run: npm run check:manifest
      - name: Build web
        run: npm run build:web
